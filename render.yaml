services:
  - type: web
    name: open-skzo-app
    runtime: node
    plan: free
    buildCommand: npm ci && npm --prefix backend ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: VITE_API_URL
        value: ""
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://open-skzo.onrender.com
